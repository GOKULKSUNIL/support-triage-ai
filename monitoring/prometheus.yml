# Prometheus scrapes the API's metrics (Setup Guide section 6), and the
# harness's while a run started with METRICS_PORT=8001 is in progress.
# Start the API first: uvicorn src.api:app --port 8000
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: "support-system"
    metrics_path: /metrics/
    static_configs:
      - targets: ["localhost:8000"]
  - job_name: "harness"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:8001"]
